<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>策略展示总站</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; background: #f4f6fa; color: #2b3445;
         max-width: 900px; margin: 0 auto; padding: 40px 20px; }
  h1 { font-size: 24px; margin-bottom: 6px; }
  .sub { color: #8492a6; font-size: 13px; margin-bottom: 28px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  a.card { display: block; background: #fff; border-radius: 10px; padding: 20px; text-decoration: none;
           color: inherit; box-shadow: 0 1px 4px rgba(0,0,0,.08); transition: transform .15s, box-shadow .15s; }
  a.card:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0,0,0,.12); }
  .card .name { font-size: 17px; font-weight: 600; margin-bottom: 6px; }
  .card .desc { font-size: 13px; color: #5a6a85; line-height: 1.6; }
  .card .go { font-size: 12px; color: #5470c6; margin-top: 12px; }
</style>
</head>
<body>
<h1>策略展示总站</h1>
<div class="sub">量化策略回测结果展示</div>
<div class="cards" id="cards"></div>
<script>
// 新增策略：在数组里加一项即可
const STRATEGIES = [
  {
    url: "macro407/",
    name: "宏观配置4.0.7",
    desc: "open_open · A股7.2.7 · 4to2 · HK15 · T日收盘减仓｜净值/回撤曲线、模块权重、每日持仓与信号",
  },
];
document.getElementById("cards").innerHTML = STRATEGIES.map(s =>
  `<a class="card" href="${s.url}">
     <div class="name">${s.name}</div>
     <div class="desc">${s.desc}</div>
     <div class="go">进入 →</div>
   </a>`).join("");
</script>
</body>
</html>
