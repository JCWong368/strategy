<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>宏观配置4.0.7 每日快报</title>
<script src="../echarts.min.js"></script>
<script src="../data.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         background: #f7f7f7; color: #333; }
  .page { max-width: 520px; margin: 0 auto; background: #fff; min-height: 100vh;
          padding: 28px 20px 40px; }
  /* 公众号式文头 */
  .art-title { font-size: 22px; font-weight: 700; line-height: 1.4; }
  .art-meta { display: flex; align-items: center; gap: 8px; margin: 10px 0 6px;
              font-size: 13px; color: #999; }
  .art-meta .tag { background: #eef3fb; color: #4a7fd6; border-radius: 4px; padding: 1px 8px; font-size: 12px; }
  .art-divider { border: none; border-top: 1px solid #eee; margin: 18px 0; }
  /* 段落标题：左侧竖条 */
  h2 { font-size: 17px; font-weight: 600; margin: 26px 0 14px; padding-left: 10px;
       border-left: 4px solid #4a7fd6; line-height: 1.2; }
  /* 大盘状态大字 */
  .state-row { display: flex; align-items: baseline; gap: 12px; margin-bottom: 10px; }
  .state-big { font-size: 34px; font-weight: 800; color: #2b3445; }
  .state-sub { font-size: 13px; color: #888; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .chip { background: #f2f4f8; border-radius: 12px; padding: 3px 10px; font-size: 12px; color: #55617a; }
  .chip.hl { background: #eaf1fc; color: #3d6fc4; }
  /* 权重条 */
  .wbar { display: flex; height: 14px; border-radius: 7px; overflow: hidden; margin: 10px 0 8px; }
  .wbar div { height: 100%; }
  .wlegend { font-size: 11px; color: #77839a; display: flex; flex-wrap: wrap; gap: 8px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 3px; }
  /* 指标两列卡 */
  .mgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .mcard { background: #f8f9fb; border-radius: 10px; padding: 12px 14px; }
  .mcard .k { font-size: 12px; color: #98a1b3; }
  .mcard .v { font-size: 19px; font-weight: 700; margin-top: 2px; }
  .pos { color: #d63031; } .neg { color: #00a661; }
  /* 持仓列表 */
  .hrow { display: flex; align-items: center; padding: 10px 2px; border-bottom: 1px solid #f0f0f0; }
  .hrow .no { width: 22px; color: #b8bfcc; font-size: 12px; }
  .hrow .nm { flex: 1; min-width: 0; }
  .hrow .nm .c { font-size: 12px; color: #98a1b3; }
  .hrow .nm .n { font-size: 14px; }
  .hrow .q { font-size: 13px; color: #55617a; white-space: nowrap; }
  /* 交易列表 */
  .tx { font-size: 13px; line-height: 1.9; }
  .tx .buy { color: #d63031; } .tx .sell { color: #00a661; }
  /* 图表 */
  #chart { width: 100%; height: 230px; margin-top: 4px; }
  .chart-tip { font-size: 11px; color: #b8bfcc; text-align: center; margin-top: 2px; }
  /* 导航 */
  .daynav { display: flex; justify-content: space-between; align-items: center; margin: 6px 0 2px; }
  .daynav button { border: 1px solid #dde3ec; background: #fff; border-radius: 16px;
                   padding: 5px 14px; font-size: 13px; color: #4a5568; }
  .daynav button:active { background: #eef2f8; }
  .daynav .cur { font-size: 13px; color: #98a1b3; }
  .foot { margin-top: 34px; font-size: 11px; color: #b0b7c3; line-height: 1.8; text-align: center; }
  .none-tip { color: #a8b0be; font-size: 13px; padding: 6px 0; }
</style>
</head>
<body>
<div class="page">
  <div class="art-title">宏观配置4.0.7 · 每日快报</div>
  <div class="art-meta">
    <span id="m-date"></span><span class="tag" id="m-state"></span>
  </div>
  <div class="daynav">
    <button id="prev">‹ 前一天</button>
    <span class="cur" id="m-idx"></span>
    <button id="next">后一天 ›</button>
  </div>
  <hr class="art-divider">

  <h2>一、今日信号</h2>
  <div id="sec-signal"></div>

  <h2>二、今日持仓</h2>
  <div id="sec-hold"></div>

  <h2>三、净值表现</h2>
  <div class="mgrid" id="sec-metrics"></div>
  <div id="chart"></div>
  <div class="chart-tip">双指缩放 / 拖动查看历史</div>

  <div class="foot">
    数据由策略回测系统自动生成，仅供研究参考，不构成投资建议<br>
    <span id="m-gen"></span>
  </div>
</div>

<script>
const D = window.STRATEGY_DATA;
const MODULE_DEF = [
  ["w_a_stock","A股","#5470c6"], ["w_hk","港股","#91cc75"], ["w_commodity","商品","#fac858"],
  ["w_global","全球","#ee6666"], ["w_alt_501025","备选501025","#73c0de"], ["w_cash","现金","#c0c8d4"],
];
const dates = D.nav.map(r => r[0]);
const wMap = {}; D.weights.forEach(r => wMap[r[0]] = r);
const redMap = {}; D.reductions.forEach(r => redMap[r[0]] = r);
const pct = (x, d=1) => (x*100).toFixed(d) + "%";
const fmtWan = x => x >= 1e8 ? (x/1e8).toFixed(2)+"亿" : (x/1e4).toFixed(1)+"万";

let curIdx = dates.length - 1;
document.getElementById("prev").onclick = () => { if (curIdx > 0) { curIdx--; render(); window.scrollTo(0,0); } };
document.getElementById("next").onclick = () => { if (curIdx < dates.length-1) { curIdx++; render(); window.scrollTo(0,0); } };

function weightBar(arr){
  const parts = MODULE_DEF.map(([key,name,color],i) => ({name,color,v:arr[i+1]||0}));
  const total = parts.reduce((s,p)=>s+p.v,0)||1;
  return `<div class="wbar">` + parts.filter(p=>p.v>0.005).map(p=>
    `<div style="width:${(p.v/total*100).toFixed(2)}%;background:${p.color}"></div>`).join("") +
    `</div><div class="wlegend">` + parts.map(p=>
    `<span><span class="dot" style="background:${p.color}"></span>${p.name} ${pct(p.v)}</span>`).join("") + `</div>`;
}

function render(){
  const d = dates[curIdx];
  const navRow = D.nav[curIdx];
  const ms = D.market_state[d];
  const sig = D.signals[d];
  const red = redMap[d];

  document.getElementById("m-date").textContent = d;
  document.getElementById("m-state").textContent = ms ? "大盘 " + ms[0] : "";
  document.getElementById("m-idx").textContent = `${curIdx+1}/${dates.length}`;

  // ---- 一、信号 ----
  let h = "";
  if (ms) {
    h += `<div class="state-row"><span class="state-big">${ms[0]}</span>
          <span class="state-sub">N20 ${ms[1]} · N5 ${ms[2]}</span></div>
          <div class="chips"><span class="chip hl">A股目标仓位 ${pct(ms[3],0)}</span>
          <span class="chip">日收益 <span class="${navRow[2]>=0?'pos':'neg'}">${pct(navRow[2],2)}</span></span>
          <span class="chip">净值 ${navRow[1].toFixed(3)}</span></div>`;
  }
  h += `<div style="font-size:13px;color:#77839a;margin-top:10px">模块权重（实际）</div>` + weightBar(wMap[d]||[]);
  if (sig) {
    if (sig.weights_t1) {
      h += `<div style="font-size:13px;color:#77839a;margin-top:12px">T+1 目标权重</div>` +
           weightBar(["d", ...MODULE_DEF.map(k => sig.weights_t1[k[0]] ?? 0)]);
    }
    if (sig.a_stock_rs_top5) h += `<div style="font-size:13px;color:#77839a;margin-top:12px">A股 RS Top5</div>
      <div class="chips">${sig.a_stock_rs_top5.map(c=>`<span class="chip hl">${D.names[c]||c}</span>`).join("")}</div>`;
    if (sig.hk_rs_top2 && sig.hk_rs_top2.length) h += `<div style="font-size:13px;color:#77839a">港股 RS Top2</div>
      <div class="chips">${sig.hk_rs_top2.map(c=>`<span class="chip hl">${D.names[c]||c}</span>`).join("")}</div>`;
    h += `<div class="chips"><span class="chip">商品系数 ${sig.commodity_avg_coef ?? "-"}</span>
          <span class="chip">全球系数 ${sig.global_avg_coef ?? "-"}</span></div>`;
    const tx = sig.a_stock_transactions || {sell:[],buy:[]};
    if (tx.sell.length || tx.buy.length) {
      h += `<div style="font-size:13px;color:#77839a;margin-top:6px">A股调仓（${tx.sell.length}卖 ${tx.buy.length}买）</div><div class="tx">` +
        [...tx.sell.map(t=>`<div class="sell">卖 ${D.names[t.code]||t.code} ${(t.quantity||0).toLocaleString()}股</div>`),
         ...tx.buy.map(t=>`<div class="buy">买 ${D.names[t.code]||t.code} ${(t.quantity||0).toLocaleString()}股</div>`)].join("") + `</div>`;
    }
  } else {
    h += `<div class="none-tip">该日期无完整调仓信号（2026-07-03 起逐日落盘），以上为可重建信号。</div>`;
  }
  if (red) h += `<div class="chips" style="margin-top:8px"><span class="chip hl">T日收盘减仓 ${pct(red[1])} · 卖出 ${fmtWan(red[2])}</span></div>`;
  document.getElementById("sec-signal").innerHTML = h;

  // ---- 二、持仓 ----
  const pos = D.positions[d] || [];
  document.getElementById("sec-hold").innerHTML = pos.length
    ? `<div style="font-size:12px;color:#98a1b3;margin-bottom:4px">共 ${pos.length} 只</div>` +
      pos.map(([c,q],i)=>`<div class="hrow"><span class="no">${i+1}</span>
        <div class="nm"><div class="n">${D.names[c]||""}</div><div class="c">${c}</div></div>
        <span class="q">${q.toLocaleString()} 股</span></div>`).join("")
    : `<div class="none-tip">当日空仓。</div>`;

  // ---- 三、指标 ----
  const m = D.metrics;
  const items = [
    ["累计收益", pct(m.total_return), m.total_return>=0?"pos":"neg"],
    ["年化收益", pct(m.annual_return), m.annual_return>=0?"pos":"neg"],
    ["最大回撤", pct(m.max_drawdown), "neg"],
    ["夏普比率", m.sharpe, ""],
  ];
  document.getElementById("sec-metrics").innerHTML = items.map(([k,v,c])=>
    `<div class="mcard"><div class="k">${k}</div><div class="v ${c}">${v}</div></div>`).join("");
  document.getElementById("m-gen").textContent = `回测区间 ${m.start} ~ ${m.end}`;
}

// ---- 净值图（触屏缩放）----
const chart = echarts.init(document.getElementById("chart"));
chart.setOption({
  animation: false,
  grid: { left: 42, right: 10, top: 14, bottom: 20 },
  xAxis: { type: "time", axisLabel: { fontSize: 10 } },
  yAxis: { type: "value", scale: true, axisLabel: { fontSize: 10 } },
  dataZoom: [ { type: "inside", zoomOnMouseWheel: false } ],
  series: [
    { name: "净值", type: "line", showSymbol: false, data: D.nav.map(r=>[r[0],r[1]]),
      lineStyle: { width: 1.5 }, color: "#4a7fd6",
      areaStyle: { color: "#4a7fd6", opacity: .06 } },
  ],
  tooltip: { trigger: "axis", textStyle: { fontSize: 11 },
    formatter: ps => { const p = ps[0]; return `${p.value[0]}<br>净值 <b>${(+p.value[1]).toFixed(3)}</b>`; } },
});

render();
window.addEventListener("resize", () => chart.resize());
</script>
</body>
</html>
